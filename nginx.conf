server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # El HTML nunca se cachea: siempre se revalida contra el servidor.
        add_header Cache-Control "no-cache, must-revalidate";

        # Fuerza al navegador a descartar cualquier service worker o caché vieja
        # de este origen (ej. de otro proyecto que corrió antes en el mismo puerto).
        # TEMPORAL: quitar esta línea una vez que el equipo confirme que ya no ve pantallas viejas.
        add_header Clear-Site-Data "\"cache\", \"executionContexts\"" always;
    }

    # Los assets compilados (JS/CSS) tienen hash en el nombre: si cambia el contenido,
    # cambia el nombre del archivo. Por eso son seguros de cachear "para siempre".
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
